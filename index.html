<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>货车拼单绕行测算工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui;-webkit-tap-highlight-color: transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;width:100%;overflow-x:auto;}
body{
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: 30px;
    background:#f6f7f9;
    min-height:100vh;
}
.box{
    background:#fff;
    padding:18px;
    border-radius:14px;
    max-width:680px;
    margin:0 auto 16px auto;
    box-shadow:0 1px 6px #00000012;
}
h2{
    text-align:center;
    margin-bottom:18px;
    color:#111;
    font-size:19px;
}
.item{
    margin-bottom:14px;
}
label{
    display:block;
    font-size:15px;
    color:#333;
    margin-bottom:6px;
}
input{
    width:100%;
    padding:12px 14px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:16px;
}
.btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:9px;
    background:#2373ea;
    color:#fff;
    font-size:17px;
    margin:10px 0;
}
.btn:disabled{
    background:#88a8e0;
}
.btn-green{
    background:#0a8046;
}
.result-box{
    padding:16px;
    background:#f8f9fa;
    border-radius:12px;
    margin-top:12px;
    display:none;
}
.line{
    display:flex;
    justify-content:space-between;
    font-size:15px;
    margin:8px 0;
}
.red{color:#d62222;font-weight:bold;}
.green{color:#089643;font-weight:bold;}
.warn{
    margin-top:14px;
    padding:11px;
    border-radius:9px;
    text-align:center;
    font-weight:bold;
    font-size:16px;
}
.ok{background:#e6f8ee;color:#099441;}
.no{background:#ffe9e9;color:#d82626;}
.tip{
    font-size:12px;
    color:#666;
    margin-top:12px;
    line-height:1.4;
}
.load-text{
    text-align:center;
    color:#2373ea;
    font-size:16px;
    margin:10px 0;
    display:none;
}
</style>

<script>
window._AMapSecurityConfig = {
    securityJsCode:'7b3dcbe878f4657447ba27559babd2d4'
}
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=3d27557bb7b7cfad571313afb5beedd5"></script>
</head>
<body>
<div class="box">
    <h2>🚛拼单绕行里程测算</h2>

    <div class="item">
        <label>A 主单装货地</label>
        <input type="text" id="addrA" placeholder="例：贵州省贵阳市观山湖区西南商贸城">
    </div>
    <div class="item">
        <label>B 主单卸货地</label>
        <input type="text" id="addrB" placeholder="例：贵州省遵义市播州区马家湾">
    </div>
    <div class="item">
        <label>C 拼单装货地（无拼单留空）</label>
        <input type="text" id="addrC" placeholder="例：贵州省贵阳市白云区艳山红镇">
    </div>
    <div class="item">
        <label>D 拼单卸货地（无拼单留空）</label>
        <input type="text" id="addrD" placeholder="例：贵州省遵义市汇川区董公寺镇">
    </div>

    <button class="btn" id="queryBtn" onclick="searchAllRoute()">查询路线，计算里程</button>
    <div class="load-text" id="loadingText">路线查询中，请等待...</div>

    <div class="result-box" id="resultBox">
        <div class="line">
            <span>A→B 原主单里程：</span>
            <span id="kmAB">-- km</span>
        </div>
        <div class="line">
            <span>A→C 主装→拼装：</span>
            <span id="kmAC">-- km</span>
        </div>
        <div class="line">
            <span>C→D 拼装→拼卸：</span>
            <span id="kmCD">-- km</span>
        </div>
        <div class="line">
            <span>D→B 拼卸→主卸：</span>
            <span id="kmDB">-- km</span>
        </div>
        <div class="line red">
            <span>✅额外绕行总里程（可手动修改）：</span>
        </div>
        <div class="item">
            <input type="number" id="extraKm" value="0" step="0.1">
        </div>

        <div class="item" style="margin-top:12px;">
            <label>绕行路段高速里程(km)</label>
            <input type="number" id="highwayKm" value="0" step="0.1">
        </div>
        <div class="item">
            <label>拼单到手运费(元)</label>
            <input type="number" id="income" value="0" step="0.01">
        </div>

        <button class="btn btn-green" onclick="calcProfit()">测算拼单收益</button>

        <div class="line">
            <span>高速成本(2.4元/km)：</span>
            <span id="highwayCost">0.00 元</span>
        </div>
        <div class="line">
            <span>下道成本(1.5元/km)：</span>
            <span id="roadCost">0.00 元</span>
        </div>
        <div class="line red">
            <span>拼单总成本：</span>
            <span id="totalCost">0.00 元</span>
        </div>
        <div class="line green">
            <span>预估净收益：</span>
            <span id="netProfit">0.00 元</span>
        </div>
        <div id="tipDom" class="warn"></div>
    </div>
    <div class="tip">
        💡提示：部署在Gitee Pages才能稳定联网计算；Github.io境外域名会被高德拦截地址解析
    </div>
</div>

<script>
const priceHighway = 2.4;
const priceLocalRoad = 1.5;
const incomeLimit = 200;
let isRequesting = false;

function getRoadDistance(startName, endName) {
    return new Promise((resolve) => {
        const drive = new AMap.Driving({
            policy: AMap.DrivingPolicy.LEAST_TIME
        });
        drive.search(startName, endName, function(status, result) {
            if (status === 'complete' && result.routes && result.routes.length > 0) {
                let km = result.routes[0].distance / 1000;
                resolve(km);
            } else {
                resolve(0);
            }
        })
    })
}

async function searchAllRoute() {
    if (isRequesting) return;
    const A = document.getElementById("addrA").value.trim();
    const B = document.getElementById("addrB").value.trim();
    const C = document.getElementById("addrC").value.trim();
    const D = document.getElementById("addrD").value.trim();

    if (!A || !B) return;

    isRequesting = true;
    const btn = document.getElementById("queryBtn");
    const loading = document.getElementById("loadingText");
    const resultBox = document.getElementById("resultBox");
    btn.disabled = true;
    loading.style.display = "block";
    resultBox.style.display = "none";

    let kmAB = await getRoadDistance(A, B);
    let kmAC = C ? await getRoadDistance(A, C) : 0;
    let kmCD = (C && D) ? await getRoadDistance(C, D) : 0;
    let kmDB = D ? await getRoadDistance(D, B) : 0;

    document.getElementById("kmAB").innerText = kmAB > 0 ? kmAB.toFixed(1) + " km" : "-- km";
    document.getElementById("kmAC").innerText = kmAC > 0 ? kmAC.toFixed(1) + " km" : "-- km";
    document.getElementById("kmCD").innerText = kmCD > 0 ? kmCD.toFixed(1) + " km" : "-- km";
    document.getElementById("kmDB").innerText = kmDB > 0 ? kmDB.toFixed(1) + " km" : "-- km";

    let extra = 0;
    if (kmAC > 0 && kmCD > 0 && kmDB > 0 && kmAB > 0) {
        const totalPick = kmAC + kmCD + kmDB;
        extra = Math.max(0, totalPick - kmAB);
    }
    document.getElementById("extraKm").value = extra.toFixed(1);
    resultBox.style.display = "block";

    loading.style.display = "none";
    btn.disabled = false;
    isRequesting = false;
}

function calcProfit() {
    const extraKm = parseFloat(document.getElementById("extraKm").value) || 0;
    const highwayKm = parseFloat(document.getElementById("highwayKm").value) || 0;
    const income = parseFloat(document.getElementById("income").value) || 0;

    let localKm = extraKm - highwayKm;
    if (localKm < 0) localKm = 0;

    const costH = highwayKm * priceHighway;
    const costL = localKm * priceLocalRoad;
    const totalCost = costH + costL;
    const profit = income - totalCost;

    document.getElementById("highwayCost").innerText = costH.toFixed(2) + " 元";
    document.getElementById("roadCost").innerText = costL.toFixed(2) + " 元";
    document.getElementById("totalCost").innerText = totalCost.toFixed(2) + " 元";
    document.getElementById("netProfit").innerText = profit.toFixed(2) + " 元";

    const tipDom = document.getElementById("tipDom");
    if (profit >= incomeLimit) {
        tipDom.className = "warn ok";
        tipDom.innerText = "✅收益达标，可以承接拼单";
    } else {
        tipDom.className = "warn no";
        tipDom.innerText = "❌收益不足200元，不建议接";
    }
}
</script>
</body>
</html>
